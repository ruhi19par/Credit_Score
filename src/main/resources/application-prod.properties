spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

app.documents.async-processing=true
app.documents.storage-provider=${DOCUMENT_STORAGE_PROVIDER:s3}
app.documents.virus-scan.enabled=${DOCUMENT_VIRUS_SCAN_ENABLED:true}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}
