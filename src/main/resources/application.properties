spring.application.name=backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/credbridge}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:4}

app.jwt.secret=${JWT_SECRET:credbridge-local-development-secret-change-me}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

app.documents.upload-dir=${DOCUMENT_UPLOAD_DIR:uploads/documents}
app.documents.max-file-size-bytes=${DOCUMENT_MAX_FILE_SIZE_BYTES:5242880}
app.documents.async-processing=${DOCUMENT_ASYNC_PROCESSING:false}
app.documents.storage-provider=${DOCUMENT_STORAGE_PROVIDER:local}
app.documents.encryption-key=${DOCUMENT_ENCRYPTION_KEY:credbridge-local-document-key-32b}
app.documents.virus-scan.enabled=${DOCUMENT_VIRUS_SCAN_ENABLED:false}
app.documents.virus-scan.command=${DOCUMENT_VIRUS_SCAN_COMMAND:clamscan}
app.documents.virus-scan.timeout-seconds=${DOCUMENT_VIRUS_SCAN_TIMEOUT_SECONDS:30}
app.documents.s3.bucket=${DOCUMENT_S3_BUCKET:}
app.documents.s3.region=${DOCUMENT_S3_REGION:us-east-1}
app.documents.s3.endpoint=${DOCUMENT_S3_ENDPOINT:}
app.documents.s3.access-key=${DOCUMENT_S3_ACCESS_KEY:}
app.documents.s3.secret-key=${DOCUMENT_S3_SECRET_KEY:}
app.documents.s3.path-style-access=${DOCUMENT_S3_PATH_STYLE_ACCESS:true}
app.ocr.provider=${OCR_PROVIDER:tesseract}
app.ocr.tesseract.command=${TESSERACT_COMMAND:tesseract}
app.ocr.tesseract.language=${TESSERACT_LANGUAGE:eng}
app.ocr.tesseract.timeout-seconds=${TESSERACT_TIMEOUT_SECONDS:30}

app.ai.enabled=${AI_ENABLED:true}
app.ai.provider=${AI_PROVIDER:groq}
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
app.ai.model=${AI_MODEL:llama-3.1-8b-instant}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
app.rate-limit.uploads-per-hour=${RATE_LIMIT_UPLOADS_PER_HOUR:10}
app.rate-limit.reports-per-minute=${RATE_LIMIT_REPORTS_PER_MINUTE:120}
app.rate-limit.general-per-minute=${RATE_LIMIT_GENERAL_PER_MINUTE:300}

app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc.override-with-generic-response=false
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
