spring.datasource.url=jdbc:h2:mem:credbridge-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.baseline-on-migrate=false

app.documents.upload-dir=target/test-uploads/documents
app.documents.max-file-size-bytes=1024
app.rate-limit.enabled=false
